# Daily sync + dashboard on GitHub Pages. Does nothing until you set the
# repository variable CF_HANDLE (Settings -> Secrets and variables -> Actions -> Variables)
# and set Settings -> Pages -> Source to "GitHub Actions".
name: daily-sync
on:
  schedule:
    - cron: "23 1 * * *"   # 01:23 UTC daily (after most Codeforces rounds finish)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CF_HANDLE != ''
    runs-on: ubuntu-latest
    env:
      ASCENT_HOME: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Sync and build dashboard
        run: |
          mkdir -p data site
          ascent init --cf "${{ vars.CF_HANDLE }}" --lc "${{ vars.LC_HANDLE }}" --target "${{ vars.TARGET_RATING || '1600' }}"
          ascent sync --rebuild
          ascent dashboard -o site/index.html
      - name: Commit journal
        run: |
          git config user.name "ascent-bot"
          git config user.email "ascent-bot@users.noreply.github.com"
          git add data/journal.jsonl data/config.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "daily sync: journal update" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
