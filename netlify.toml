# Netlify builds the dashboard on its own servers (which can reach the
# Codeforces / LeetCode APIs) and publishes it. Connect this repo in Netlify:
# Add new site -> Import an existing project -> GitHub -> this repo. No other settings needed.
[build]
  command = "bash netlify/build.sh"
  publish = "site"
  # Skip deploys for docs/tests-only pushes (each production deploy costs credits).
  ignore = "bash netlify/ignore.sh"

[build.environment]
  PYTHON_VERSION = "3.12"
  # Your handles (public profile names). Can also be set in Netlify's UI:
  # Site configuration -> Environment variables.
  CF_HANDLE = "Ishaan-K"
  LC_HANDLE = "Ishaan-Kaneria"
  TARGET_RATING = "1600"
  # Fresh data published every ~5 min by .github/workflows/sync.yml (free, no Netlify deploys).
  ASCENT_LIVE_DATA_URL = "https://ishaan-kaneria.github.io/ascent/data.json"

# Live sync: /api/live lets the page show your latest activity without any
# deploy. The scheduled "autobuild" rebuilds only when there is new activity,
# at most every AUTOBUILD_MIN_HOURS (default 72) to save Free-plan credits.
# For autobuild, add NETLIFY_BUILD_HOOK in Site configuration -> Environment variables.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
