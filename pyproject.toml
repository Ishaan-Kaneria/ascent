[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ascent-cp"
version = "1.0.0"
description = "Evidence-based Codeforces / DSA trainer: real data, honest skill estimates, problems above your level."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ascent = "ascent.cli:main"

[tool.setuptools.packages.find]
include = ["ascent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
